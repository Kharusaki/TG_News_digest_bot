services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  bot:
    build: .
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      DB_PATH: /data/bot.db
    volumes:
      - ./data:/data
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  redis_data:
